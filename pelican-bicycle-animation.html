<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  :root{ color-scheme: dark; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; }
  body{
    background: radial-gradient(130% 90% at 50% 0%, #22384f 0%, #141d28 55%, #0d131a 100%);
    color:#e9eff8;
    font-family: system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:28px 16px;
  }
  h1{ margin:0; font-size:clamp(15px,2.3vw,21px); font-weight:650; letter-spacing:.05em; text-align:center; }
  h1 b{ color:#ffb340; font-weight:inherit; }
  figure{ margin:0; width:min(980px,100%); }
  svg{ display:block; width:100%; height:auto; border-radius:16px;
       box-shadow:0 28px 64px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.09); }
  .cap{ margin:0; font-size:13px; line-height:1.75; color:#8ea4bb; text-align:center; }
  .cap em{ font-style:normal; color:#cfe3f7; }

  /* ---------- 纯位移 / 透明度的循环动画（不涉及旋转原点，兼容性最稳） ---------- */
  @keyframes drift{ from{ transform:translateX(0); } to{ transform:translateX(-1400px); } }
  .drift{ animation-name:drift; animation-timing-function:linear; animation-iteration-count:infinite; }
  .d1{ animation-duration:34s; } .d2{ animation-duration:48s; }
  .d3{ animation-duration:66s; } .d4{ animation-duration:84s; }

  @keyframes whoosh{ 0%,100%{ opacity:.04; } 16%{ opacity:.6; } 42%{ opacity:.16; } }
  .whoosh{ animation:whoosh .85s ease-in-out infinite; }
  .w2{ animation-duration:1.05s; animation-delay:-.3s; }
  .w3{ animation-duration:1.3s;  animation-delay:-.62s; }

  @media (prefers-reduced-motion: reduce){ .drift,.whoosh{ animation:none; } .whoosh{ opacity:.35; } }
</style>
</head>
<body>

<h1>鹈鹕骑自行车 · <b>SVG 2D 动画</b></h1>

<figure>
<svg id="scene" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink" role="img"
     aria-label="一只系着蓝围巾的鹈鹕在滨海公路上骑着红色自行车飞驰：车轮转动、双腿蹬踏、翅膀挥舞、背景三层视差后退">
<title>鹈鹕骑自行车</title>

<defs>
  <!-- ================= 渐变 ================= -->
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#79c6ea"/><stop offset=".45" stop-color="#bfe2f5"/>
    <stop offset=".78" stop-color="#e6eef2"/><stop offset="1" stop-color="#f7e6c6"/>
  </linearGradient>
  <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#fffbe0" stop-opacity=".95"/>
    <stop offset=".42" stop-color="#ffeaa0" stop-opacity=".55"/>
    <stop offset="1" stop-color="#ffeaa0" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8dc9e2"/><stop offset="1" stop-color="#4e93b6"/>
  </linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e6c07b"/><stop offset=".45" stop-color="#d6a95f"/>
    <stop offset="1" stop-color="#b98d47"/>
  </linearGradient>
  <linearGradient id="beakG" x1="0" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#ffd071"/><stop offset=".55" stop-color="#ffb03f"/>
    <stop offset="1" stop-color="#ef8a1c"/>
  </linearGradient>
  <linearGradient id="pouchG" x1="0" y1="0" x2=".2" y2="1">
    <stop offset="0" stop-color="#ffc260"/><stop offset=".5" stop-color="#fca22f"/>
    <stop offset="1" stop-color="#ee7d16"/>
  </linearGradient>
  <linearGradient id="feather" x1=".15" y1="0" x2=".85" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".58" stop-color="#f6f8fd"/>
    <stop offset="1" stop-color="#dde5f3"/>
  </linearGradient>
  <linearGradient id="frameG" x1="0" y1="0" x2=".6" y2="1">
    <stop offset="0" stop-color="#f2635a"/><stop offset=".5" stop-color="#dd3d42"/>
    <stop offset="1" stop-color="#ac2233"/>
  </linearGradient>
  <linearGradient id="motionG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset=".45" stop-color="#ffffff" stop-opacity=".9"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="padG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7a4a2b"/><stop offset="1" stop-color="#5a3220"/>
  </linearGradient>
  <filter id="blurS" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>

  <!-- ================= 复用零件 ================= -->
  <g id="cloud">
    <ellipse cx="0" cy="0" rx="54" ry="23"/><ellipse cx="-42" cy="9" rx="34" ry="16"/>
    <ellipse cx="44" cy="10" rx="31" ry="15"/><ellipse cx="6" cy="-16" rx="31" ry="19"/>
    <ellipse cx="-16" cy="-9" rx="24" ry="16"/>
  </g>
  <g id="gull" fill="none" stroke="#5a6b7d" stroke-width="2.6" stroke-linecap="round">
    <path d="M-15 0 Q-7 -9 0 0 Q7 -9 15 0"/>
  </g>
  <g id="bgPalm">
    <path d="M0 0 C1 -16, -8 -30, -24 -36" fill="none" stroke="#3d8a78" stroke-width="4" stroke-linecap="round"/>
    <path d="M0 0 C3 -18, 0 -34, -6 -46" fill="none" stroke="#3d8a78" stroke-width="4" stroke-linecap="round"/>
    <path d="M0 0 C6 -16, 16 -28, 30 -32" fill="none" stroke="#3d8a78" stroke-width="4" stroke-linecap="round"/>
    <path d="M0 2 C-2 -14, -14 -24, -28 -26" fill="none" stroke="#4a9c85" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M0 2 C4 -12, 14 -22, 28 -22" fill="none" stroke="#4a9c85" stroke-width="3.4" stroke-linecap="round"/>
  </g>
  <g id="bgBush" fill="#5ba184">
    <ellipse cx="0" cy="0" rx="34" ry="21"/><ellipse cx="-28" cy="6" rx="24" ry="15"/>
    <ellipse cx="28" cy="6" rx="22" ry="14"/><ellipse cx="-4" cy="-14" rx="22" ry="14"/>
  </g>
  <g id="fgTuft">
    <path d="M0 0 C-4 -22, -14 -34, -26 -42" fill="none" stroke="#2c8558" stroke-width="5" stroke-linecap="round"/>
    <path d="M4 0 C4 -26, -2 -42, -8 -54" fill="none" stroke="#3ba06a" stroke-width="5" stroke-linecap="round"/>
    <path d="M8 0 C12 -22, 20 -36, 32 -46" fill="none" stroke="#2c8558" stroke-width="5" stroke-linecap="round"/>
    <path d="M-8 4 C-16 -14, -28 -24, -40 -28" fill="none" stroke="#3ba06a" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M12 4 C22 -10, 34 -18, 46 -20" fill="none" stroke="#3ba06a" stroke-width="4.4" stroke-linecap="round"/>
  </g>
  <g id="fgBush">
    <ellipse cx="0" cy="0" rx="52" ry="34" fill="#1f6b45"/>
    <ellipse cx="-42" cy="10" rx="36" ry="24" fill="#25794f"/>
    <ellipse cx="44" cy="12" rx="34" ry="22" fill="#1f6b45"/>
    <ellipse cx="2" cy="-20" rx="34" ry="22" fill="#2b8a5b"/>
  </g>

  <!-- 车轮：圆心位于本地原点，便于“绕自身原点”旋转 -->
  <g id="wheelArt">
    <circle r="100" fill="none" stroke="#2a2f38" stroke-width="15"/>
    <circle r="100" fill="none" stroke="#505863" stroke-width="15" stroke-dasharray="6 13"/>
    <circle r="92.5" fill="none" stroke="#8e99a8" stroke-width="3.4"/>
    <circle r="86" fill="none" stroke="#e9eef6" stroke-width="1.6" opacity=".55"/>
    <g stroke="#e4eaf3" stroke-width="1.7" opacity=".92">
      <line x1="71.5" y1="19.2" x2="-71.5" y2="-19.2"/><line x1="52.3" y1="52.3" x2="-52.3" y2="-52.3"/>
      <line x1="19.2" y1="71.5" x2="-19.2" y2="-71.5"/><line x1="-19.2" y1="71.5" x2="19.2" y2="-71.5"/>
      <line x1="-52.3" y1="52.3" x2="52.3" y2="-52.3"/><line x1="-71.5" y1="19.2" x2="71.5" y2="-19.2"/>
      <line x1="-71.5" y1="-19.2" x2="71.5" y2="19.2"/><line x1="-52.3" y1="-52.3" x2="52.3" y2="52.3"/>
      <line x1="-19.2" y1="-71.5" x2="19.2" y2="71.5"/><line x1="19.2" y1="-71.5" x2="-19.2" y2="71.5"/>
      <line x1="52.3" y1="-52.3" x2="-52.3" y2="52.3"/><line x1="71.5" y1="-19.2" x2="-71.5" y2="19.2"/>
    </g>
    <circle r="18" fill="#c6cedb" stroke="#8e99a8" stroke-width="2.5"/>
    <circle r="7.5" fill="#6f7a8a"/><circle r="3" fill="#39404b"/>
    <circle r="68" fill="none" stroke="#ffffff" stroke-width="2" opacity=".3"/>
  </g>

  <!-- 踏板：上表面在本地 y=0，向 +x 伸出 -->
  <g id="pedalArt">
    <rect x="-13" y="0" width="26" height="8.5" rx="3.5" fill="#39404b"/>
    <rect x="-13" y="0" width="26" height="3.2" rx="1.6" fill="#6c7684"/>
  </g>
</defs>

<!-- ================================================================
     1. 天空 · 太阳 · 云 · 海鸥
     ================================================================ -->
<rect width="800" height="600" fill="url(#sky)"/>
<circle cx="646" cy="146" r="150" fill="url(#sunGlow)"/>
<circle cx="646" cy="146" r="45" fill="#fffbdd" opacity=".97"/>

<g fill="#ffffff" opacity=".88"><g transform="translate(120,96)"><g class="drift d1"><use xlink:href="#cloud"/></g></g></g>
<g fill="#ffffff" opacity=".88"><g transform="translate(860,150) scale(.82)"><g class="drift d1"><use xlink:href="#cloud"/></g></g></g>
<g fill="#ffffff" opacity=".72"><g transform="translate(420,178) scale(.66)"><g class="drift d2"><use xlink:href="#cloud"/></g></g></g>
<g fill="#ffffff" opacity=".72"><g transform="translate(1240,92) scale(.58)"><g class="drift d2"><use xlink:href="#cloud"/></g></g></g>
<g fill="#ffffff" opacity=".55"><g transform="translate(640,238) scale(.52)"><g class="drift d3"><use xlink:href="#cloud"/></g></g></g>
<g fill="#ffffff" opacity=".55"><g transform="translate(1600,262) scale(.48)"><g class="drift d3"><use xlink:href="#cloud"/></g></g></g>
<g opacity=".85">
  <g transform="translate(300,132) scale(.55)"><g class="drift d4"><use xlink:href="#gull"/></g></g>
  <g transform="translate(760,110) scale(.42)"><g class="drift d4"><use xlink:href="#gull"/></g></g>
  <g transform="translate(1180,168) scale(.5)"><g class="drift d4"><use xlink:href="#gull"/></g></g>
  <g transform="translate(1660,142) scale(.46)"><g class="drift d4"><use xlink:href="#gull"/></g></g>
</g>

<!-- ================================================================
     2. 背景视差层：海面 + 滨海步道（整层宽 800，整体左移 800 后无缝循环）
     ================================================================ -->
<g id="bgFar">
  <animateTransform attributeName="transform" type="translate" calcMode="linear"
                    dur="16.32s" repeatCount="indefinite" values="0 0; -800 0"/>
  <g>
    <rect x="0" y="316" width="800" height="54" fill="url(#sea)"/>
    <path d="M0 318 H800" stroke="#cdeefb" stroke-width="2.6" opacity=".85"/>
    <g stroke="#cfeaf7" stroke-width="2" opacity=".5" stroke-linecap="round">
      <path d="M40 336 H96"/><path d="M150 348 H196"/><path d="M240 330 H286"/><path d="M330 344 H392"/>
      <path d="M430 332 H486"/><path d="M520 350 H580"/><path d="M620 336 H676"/><path d="M712 346 H766"/>
      <path d="M96 360 H150"/><path d="M300 362 H352"/><path d="M470 360 H520"/><path d="M640 362 H692"/>
    </g>
    <rect x="0" y="370" width="800" height="26" fill="#e3cfa4"/>
    <rect x="0" y="370" width="800" height="4.5" fill="#f2e3c2"/>
    <rect x="0" y="390" width="800" height="6" fill="#c9ae7c" opacity=".75"/>
    <g transform="translate(60,394) scale(1.05)"><use xlink:href="#bgPalm"/></g>
    <g transform="translate(232,394) scale(.88)"><use xlink:href="#bgPalm"/></g>
    <g transform="translate(468,394) scale(.96)"><use xlink:href="#bgPalm"/></g>
    <g transform="translate(724,394) scale(1.1)"><use xlink:href="#bgPalm"/></g>
    <g transform="translate(150,394) scale(.8)"><use xlink:href="#bgBush"/></g>
    <g transform="translate(360,396) scale(.66)"><use xlink:href="#bgBush"/></g>
    <g transform="translate(600,396) scale(.72)"><use xlink:href="#bgBush"/></g>
  </g>
  <g transform="translate(800,0)">
    <rect x="0" y="316" width="800" height="54" fill="url(#sea)"/>
    <path d="M0 318 H800" stroke="#cdeefb" stroke-width="2.6" opacity=".85"/>
    <g stroke="#cfeaf7" stroke-width="2" opacity=".5" stroke-linecap="round">
      <path d="M40 336 H96"/><path d="M150 348 H196"/><path d="M240 330 H286"/><path d="M330 344 H392"/>
      <path d="M430 332 H486"/><path d="M520 350 H580"/><path d="M620 336 H676"/><path d="M712 346 H766"/>
      <path d="M96 360 H150"/><path d="M300 362 H352"/><path d="M470 360 H520"/><path d="M640 362 H692"/>
    </g>
    <rect x="0" y="370" width="800" height="26" fill="#e3cfa4"/>
    <rect x="0" y="370" width="800" height="4.5" fill="#f2e3c2"/>
    <rect x="0" y="390" width="800" height="6" fill="#c9ae7c" opacity=".75"/>
    <g transform="translate(60,394) scale(1.05)"><use xlink:href="#bgPalm"/></g>
    <g transform="translate(232,394) scale(.88)"><use xlink:href="#bgPalm"/></g>
    <g transform="translate(468,394) scale(.96)"><use xlink:href="#bgPalm"/></g>
    <g transform="translate(724,394) scale(1.1)"><use xlink:href="#bgPalm"/></g>
    <g transform="translate(150,394) scale(.8)"><use xlink:href="#bgBush"/></g>
    <g transform="translate(360,396) scale(.66)"><use xlink:href="#bgBush"/></g>
    <g transform="translate(600,396) scale(.72)"><use xlink:href="#bgBush"/></g>
  </g>
</g>

<!-- ================================================================
     3. 路面（静止底 + 滚动纹理层）
     ================================================================ -->
<rect x="0" y="396" width="800" height="204" fill="url(#road)"/>
<path d="M0 398.5 H800" stroke="#f6e4bd" stroke-width="3.4" opacity=".9"/>
<path d="M0 403 H800" stroke="#a97c33" stroke-width="2" opacity=".3"/>

<g id="roadTex">
  <animateTransform attributeName="transform" type="translate" calcMode="linear"
                    dur="9.52s" repeatCount="indefinite" values="0 0; -800 0"/>
  <g fill="#a97c33" opacity=".42">
    <ellipse cx="70" cy="454" rx="16" ry="3.4"/><ellipse cx="240" cy="518" rx="22" ry="3.8"/>
    <ellipse cx="420" cy="472" rx="13" ry="3"/><ellipse cx="560" cy="550" rx="19" ry="3.6"/>
    <ellipse cx="660" cy="432" rx="11" ry="2.6"/><ellipse cx="740" cy="502" rx="15" ry="3.2"/>
    <ellipse cx="150" cy="578" rx="18" ry="3.6"/><ellipse cx="330" cy="426" rx="12" ry="2.8"/>
    <ellipse cx="500" cy="592" rx="14" ry="3"/>
  </g>
  <g fill="#f3dcae" opacity=".35">
    <ellipse cx="180" cy="488" rx="20" ry="3.4"/><ellipse cx="360" cy="558" rx="16" ry="3"/>
    <ellipse cx="600" cy="472" rx="24" ry="3.8"/><ellipse cx="30" cy="526" rx="14" ry="3"/>
    <ellipse cx="700" cy="582" rx="18" ry="3.4"/><ellipse cx="460" cy="420" rx="12" ry="2.6"/>
  </g>
  <g transform="translate(120,600) scale(1.15)"><use xlink:href="#fgTuft"/></g>
  <g transform="translate(300,600) scale(.9)"><use xlink:href="#fgTuft"/></g>
  <g transform="translate(520,600) scale(1.05)"><use xlink:href="#fgTuft"/></g>
  <g transform="translate(700,600) scale(.85)"><use xlink:href="#fgTuft"/></g>
</g>

<!-- ================================================================
     4. 呼啸速度线
     ================================================================ -->
<g class="whoosh" stroke="url(#motionG)" stroke-linecap="round" fill="none">
  <path d="M28 150 H232" stroke-width="6"/><path d="M-10 196 H150" stroke-width="4.5"/>
</g>
<g class="whoosh w2" stroke="url(#motionG)" stroke-linecap="round" fill="none">
  <path d="M60 456 H320" stroke-width="7"/><path d="M120 596 H392" stroke-width="5"/>
</g>
<g class="whoosh w3" stroke="url(#motionG)" stroke-linecap="round" fill="none">
  <path d="M10 300 H180" stroke-width="4"/><path d="M150 246 H330" stroke-width="3.4"/>
</g>

<!-- ================================================================
     5. 自行车
     ================================================================ -->
<g id="bike" stroke-linecap="round">
  <!-- 轮下投影 -->
  <ellipse cx="300" cy="521" rx="300" ry="12" fill="#7b5620" opacity=".28" filter="url(#blurS)" stroke="none"/>

  <!-- 后轮 -->
  <g transform="translate(248,414)">
    <g><animateTransform attributeName="transform" type="rotate" calcMode="linear"
          dur="2s" repeatCount="indefinite" values="0;360"/>
      <use xlink:href="#wheelArt"/></g>
  </g>

  <!-- 链条 / 飞轮 / 齿盘 -->
  <path d="M248 399 L500 383" fill="none" stroke="#8d97a4" stroke-width="3.2" stroke-dasharray="6 3"/>
  <path d="M248 429 L500 445" fill="none" stroke="#8d97a4" stroke-width="3.2" stroke-dasharray="6 3"/>
  <circle cx="248" cy="414" r="16" fill="#c3cbd6" stroke="#8e99a8" stroke-width="2"/>
  <circle cx="248" cy="414" r="6" fill="#6f7a8a" stroke="none"/>

  <!-- 远侧曲柄（基准 90°） -->
  <g transform="translate(500,414) rotate(90)">
    <g><animateTransform attributeName="transform" type="rotate" calcMode="linear"
          dur="2s" repeatCount="indefinite" values="0;360"/>
      <path d="M0 0 L24 0" fill="none" stroke="#77808f" stroke-width="8"/>
      <g transform="translate(26,0)" opacity=".92"><use xlink:href="#pedalArt"/></g></g>
  </g>

  <!-- 车架 -->
  <path d="M248 414 L500 414" fill="none" stroke="#c8373f" stroke-width="10"/>
  <path d="M500 414 L398 284" fill="none" stroke="url(#frameG)" stroke-width="11"/>
  <path d="M500 414 L600 390" fill="none" stroke="url(#frameG)" stroke-width="11"/>
  <path d="M394 326 L588 344" fill="none" stroke="url(#frameG)" stroke-width="9.5"/>
  <path d="M600 390 L748 414" fill="none" stroke="#4b545f" stroke-width="8.5"/>
  <path d="M600 390 L600 328" fill="none" stroke="url(#frameG)" stroke-width="13"/>
  <circle cx="500" cy="414" r="13" fill="#39404b" stroke="#2b3038" stroke-width="2"/>

  <!-- 坐垫 -->
  <g transform="rotate(-7 400 281)">
    <ellipse cx="400" cy="281" rx="36" ry="11" fill="url(#padG)"/>
    <ellipse cx="404" cy="278" rx="30" ry="6" fill="#8d5a35" opacity=".65"/>
  </g>

  <!-- 车把 -->
  <path d="M600 328 L602 296" fill="none" stroke="#5b6472" stroke-width="8"/>
  <path d="M582 292 C588 286, 606 284, 634 288" fill="none" stroke="#5b6472" stroke-width="7.5"/>
  <rect x="578" y="283" width="22" height="14" rx="7" fill="#2f3641" transform="rotate(-6 589 290)"/>
  <rect x="620" y="280" width="24" height="14" rx="7" fill="#2f3641" transform="rotate(7 632 287)"/>

  <!-- 齿盘（压在远侧曲柄上，形成前后关系） -->
  <circle cx="500" cy="414" r="33" fill="#cfd7e1" stroke="#8e99a8" stroke-width="2"/>
  <circle cx="500" cy="414" r="26" fill="#eef2f8" stroke="#b9c2ce" stroke-width="1.6"/>
  <g fill="#b9c2ce" stroke="none">
    <circle cx="500" cy="388" r="4"/><circle cx="500" cy="440" r="4"/>
    <circle cx="474" cy="414" r="4"/><circle cx="526" cy="414" r="4"/>
  </g>

  <!-- 近侧曲柄（基准 270°） -->
  <g transform="translate(500,414) rotate(270)">
    <g><animateTransform attributeName="transform" type="rotate" calcMode="linear"
          dur="2s" repeatCount="indefinite" values="0;360"/>
      <path d="M0 0 L24 0" fill="none" stroke="#c3cbd6" stroke-width="9"/>
      <g transform="translate(26,0)"><use xlink:href="#pedalArt"/></g></g>
  </g>

  <!-- 前轮 -->
  <g transform="translate(748,414)">
    <g><animateTransform attributeName="transform" type="rotate" calcMode="linear"
          dur="2s" repeatCount="indefinite" values="0;360"/>
      <use xlink:href="#wheelArt"/></g>
  </g>
</g>

<!-- ================================================================
     6. 鹈鹕（整体绕五通轻微上下起伏；各关节用嵌套枢轴组驱动）
     ================================================================ -->
<g transform="translate(500,414) rotate(-1.3)">
<g id="pelicanRock">
  <animateTransform attributeName="transform" type="rotate" calcMode="linear"
                    dur="1s" repeatCount="indefinite" values="0;2.6;0"/>
  <g transform="translate(-500,-414)">
